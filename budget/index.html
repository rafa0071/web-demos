<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket · Budget Tracker (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e1116; --panel: #161b22; --panel2: #1d242e; --ink: #e8edf3; --muted: #8b97a6; --line: #262f3b; --green: #3ddc97; --red: #ff6b6b; --accent: #7c9cff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--ink); }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 22px 40px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 24px; margin-right: auto; }
  header h1 span { color: var(--green); }
  .month { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .month button { border: 0; background: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; }
  .month button:hover { background: var(--panel2); }
  .month b { min-width: 130px; text-align: center; font-weight: 600; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .card small { color: var(--muted); }
  .card .big { font-size: 30px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
  .card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  form.add { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 12px; }
  form.add input[name=desc] { grid-column: span 4; } form.add > * { grid-column: span 2; }
  form.add input, form.add select { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  form.add button { background: var(--green); color: #0e1116; border: 0; border-radius: 10px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  .tx { max-height: 380px; overflow: auto; }
  .row { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .row .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; }
  .row small { color: var(--muted); display: block; font-size: 12px; }
  .row .del { border: 0; background: none; color: var(--muted); cursor: pointer; opacity: 0; }
  .row:hover .del { opacity: 1; }
  .budgets { display: grid; gap: 14px; }
  .b-row { display: grid; gap: 6px; font-size: 14px; }
  .b-row div:first-child { display: flex; justify-content: space-between; }
  .b-row em { height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; display: block; }
  .b-row em i { display: block; height: 100%; border-radius: 99px; transition: width .5s; }
  .b-row .warn { color: var(--red); font-size: 12px; }
  svg { display: block; width: 100%; height: auto; }
  .seg { display: flex; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  @media (max-width: 900px) { .grid, .cards { grid-template-columns: 1fr; } form.add { grid-template-columns: 1fr 1fr; } form.add > * { grid-column: auto; } form.add input[name=desc] { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>pocket<span>.</span></h1>
    <div class="month"><button id="prev" aria-label="Previous month">‹</button><b id="mlabel"></b><button id="next" aria-label="Next month">›</button></div>
    <button class="btn" id="csv">Export CSV</button>
  </header>
  <section class="cards">
    <div class="card"><small>Income</small><div class="big pos" id="inc"></div></div>
    <div class="card"><small>Spending</small><div class="big neg" id="exp"></div></div>
    <div class="card"><small>Saved this month</small><div class="big" id="net"></div><small id="rate"></small></div>
  </section>
  <section class="grid">
    <div class="card">
      <h3>Transactions</h3>
      <form class="add" id="add">
        <input name="desc" placeholder="Description" required maxlength="60">
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
        <select name="cat"></select>
        <input name="date" type="date" required>
        <button>Add</button>
      </form>
      <div class="seg" id="kind" style="margin-bottom:8px"><button class="on" data-k="all">All</button><button data-k="exp">Expenses</button><button data-k="inc">Income</button></div>
      <div class="tx" id="tx"></div>
    </div>
    <div style="display:grid;gap:14px;align-content:start">
      <div class="card"><h3>Where the money went</h3><svg id="pie" viewBox="0 0 320 170"></svg></div>
      <div class="card"><h3>Monthly budgets</h3><div class="budgets" id="budgets"></div></div>
    </div>
  </section>
</div>
<script>
  const CATS = { Salary: ['💼', '#3ddc97', 0], Freelance: ['🧑‍💻', '#2bb5a0', 0], Rent: ['🏠', '#7c9cff', 1200], Groceries: ['🛒', '#ffb86b', 450], Dining: ['🍜', '#ff6b9a', 200], Transport: ['🚇', '#b48cff', 120], Fun: ['🎮', '#ffd93d', 150], Bills: ['💡', '#6bd4ff', 180] };
  const INCOME = ['Salary', 'Freelance'];
  // Local-date strings (toISOString would shift days in non-UTC time zones)
  const ymd = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const iso = (y, m, d) => ymd(new Date(y, m, d));
  function seed() {
    const out = []; let id = 1; const now = new Date();
    for (let back = 0; back < 3; back++) {
      const y = now.getFullYear(), m = now.getMonth() - back;
      const add = (d, desc, cat, amt) => out.push({ id: id++, date: iso(y, m, d), desc, cat, amount: amt });
      add(1, 'Monthly salary', 'Salary', 4200); add(3, 'Apartment rent', 'Rent', 1200); add(5, 'Website project', 'Freelance', 650 + back * 120);
      add(6, 'Farmers market', 'Groceries', 64.2 + back * 3); add(9, 'Supermarket', 'Groceries', 132.8); add(11, 'Metro card', 'Transport', 95);
      add(12, 'Ramen with friends', 'Dining', 46.5); add(15, 'Electricity & internet', 'Bills', 118.4); add(18, 'Concert tickets', 'Fun', 89 + back * 20);
      add(20, 'Supermarket', 'Groceries', 151.3 - back * 10); add(22, 'Pizza night', 'Dining', 38); add(25, 'Streaming services', 'Bills', 27.97); add(27, 'Bistro brunch', 'Dining', 72.4 + back * 25);
    }
    return out;
  }
  let tx;
  try { tx = JSON.parse(localStorage.getItem('pocket-tx')); } catch {}
  tx = tx || seed();
  const save = () => { try { localStorage.setItem('pocket-tx', JSON.stringify(tx)); } catch {} };
  let view = new Date(); view.setDate(1); let kind = 'all';
  const $ = (id) => document.getElementById(id);
  const usd = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const NS = 'http://www.w3.org/2000/svg';

  function render() {
    const key = ymd(view).slice(0, 7);
    $('mlabel').textContent = view.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const month = tx.filter((t) => t.date.startsWith(key)).sort((a, b) => b.date.localeCompare(a.date));
    const inc = month.filter((t) => INCOME.includes(t.cat)).reduce((s, t) => s + t.amount, 0);
    const exp = month.filter((t) => !INCOME.includes(t.cat)).reduce((s, t) => s + t.amount, 0);
    $('inc').textContent = usd(inc); $('exp').textContent = usd(exp);
    $('net').textContent = usd(inc - exp); $('net').className = 'big ' + (inc - exp >= 0 ? 'pos' : 'neg');
    $('rate').textContent = inc ? `Savings rate ${Math.round((inc - exp) / inc * 100)}%` : '';

    const shown = month.filter((t) => kind === 'all' || (kind === 'inc') === INCOME.includes(t.cat));
    $('tx').innerHTML = shown.length ? '' : '<p style="color:var(--muted)">No transactions yet.</p>';
    for (const t of shown) {
      const isInc = INCOME.includes(t.cat), [ic, c] = CATS[t.cat];
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<span class="ic" style="background:${c}22">${ic}</span><div><span class="d"></span><small>${t.cat} · ${new Date(t.date + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</small></div><b class="${isInc ? 'pos' : ''}">${isInc ? '+' : '−'}${usd(t.amount)}</b><button class="del" data-id="${t.id}" aria-label="Delete">✕</button>`;
      row.querySelector('.d').textContent = t.desc;
      $('tx').append(row);
    }

    const byCat = {};
    month.filter((t) => !INCOME.includes(t.cat)).forEach((t) => (byCat[t.cat] = (byCat[t.cat] || 0) + t.amount));
    const svg = $('pie'); svg.innerHTML = '';
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    let a0 = -Math.PI / 2;
    entries.forEach(([cat, v], i) => {
      const a1 = a0 + v / exp * Math.PI * 2, R = 72, r = 46, cx = 85, cy = 85, big = a1 - a0 > Math.PI ? 1 : 0, p = (a, k) => `${cx + k * Math.cos(a)} ${cy + k * Math.sin(a)}`;
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', `M${p(a0, R)} A${R} ${R} 0 ${big} 1 ${p(a1 - 0.001, R)} L${p(a1 - 0.001, r)} A${r} ${r} 0 ${big} 0 ${p(a0, r)} Z`);
      path.setAttribute('fill', CATS[cat][1]); svg.append(path); a0 = a1;
      if (i < 6) {
        const t = document.createElementNS(NS, 'text'); t.setAttribute('x', 180); t.setAttribute('y', 30 + i * 22); t.setAttribute('fill', '#c9d2dd'); t.setAttribute('font-size', 12);
        t.textContent = `${CATS[cat][0]} ${cat} ${Math.round(v / exp * 100)}%`; svg.append(t);
      }
    });
    if (!entries.length) { const t = document.createElementNS(NS, 'text'); t.setAttribute('x', 160); t.setAttribute('y', 90); t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', '#8b97a6'); t.textContent = 'No spending this month'; svg.append(t); }

    $('budgets').innerHTML = Object.entries(CATS).filter(([, v]) => v[2]).map(([cat, [ic, c, lim]]) => {
      const spent = byCat[cat] || 0, pct = spent / lim * 100;
      return `<div class="b-row"><div><span>${ic} ${cat}</span><span>${usd(spent)} <small style="color:var(--muted)">/ ${usd(lim)}</small></span></div><em><i style="width:${Math.min(100, pct)}%;background:${pct > 100 ? 'var(--red)' : c}"></i></em>${pct > 100 ? `<span class="warn">Over budget by ${usd(spent - lim)}</span>` : ''}</div>`;
    }).join('');
  }

  const f = $('add');
  Object.keys(CATS).forEach((c) => f.cat.add(new Option(`${CATS[c][0]} ${c}`, c, c === 'Groceries', c === 'Groceries')));
  f.date.value = ymd(new Date());
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    tx.push({ id: Math.max(0, ...tx.map((t) => t.id)) + 1, date: f.date.value, desc: f.desc.value.trim(), cat: f.cat.value, amount: Math.round(+f.amount.value * 100) / 100 });
    save(); f.desc.value = ''; f.amount.value = '';
    view = new Date(f.date.value + 'T12:00'); view.setDate(1); render();
  });
  $('tx').addEventListener('click', (e) => { const b = e.target.closest('.del'); if (b) { tx = tx.filter((t) => t.id !== +b.dataset.id); save(); render(); } });
  $('kind').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; kind = b.dataset.k; $('kind').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); render(); });
  $('prev').onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
  $('next').onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
  $('csv').onclick = () => {
    const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const csv = 'date,description,category,amount\n' + tx.map((t) => [t.date, q(t.desc), t.cat, (INCOME.includes(t.cat) ? '' : '-') + t.amount].join(',')).join('\n');
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: 'pocket-transactions.csv' }); a.click();
  };
  render();
</script>
</body>
</html>
