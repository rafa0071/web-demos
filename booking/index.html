<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Studio · Online Booking (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fdf7f4; --ink: #2a1f1d; --muted: #8a7b76; --line: #f0e3dd; --accent: #d9677a; --soft: #fbe7ea; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Urbanist, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: grid; place-items: center; padding: 30px 16px; }
  button, input { font: inherit; }
  .box { width: min(1060px, 100%); background: #fff; border-radius: 26px; box-shadow: 0 40px 80px -40px rgba(120, 50, 60, .35); display: grid; grid-template-columns: 300px 1fr; overflow: hidden; }
  .left { background: linear-gradient(170deg, #2a1f1d, #4a2d2f); color: #fff; padding: 30px; display: flex; flex-direction: column; gap: 18px; }
  .left b.logo { font-size: 22px; font-weight: 800; letter-spacing: .02em; }
  .left b.logo span { color: var(--accent); }
  .steps { display: grid; gap: 10px; margin-top: 10px; }
  .steps div { display: flex; gap: 12px; align-items: center; color: #b9a6a2; font-weight: 600; }
  .steps i { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #6b5450; display: grid; place-items: center; font-style: normal; font-size: 13px; }
  .steps .on { color: #fff; } .steps .on i { background: var(--accent); border-color: var(--accent); }
  .steps .ok i { background: #fff; color: var(--ink); border-color: #fff; }
  .summary { margin-top: auto; background: rgba(255, 255, 255, .07); border-radius: 16px; padding: 16px; font-size: 14px; display: grid; gap: 8px; }
  .summary div { display: flex; justify-content: space-between; gap: 10px; color: #d9cbc7; }
  .summary div b { color: #fff; text-align: right; }
  .right { padding: 30px 34px; min-height: 560px; display: flex; flex-direction: column; }
  h2 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .services { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .svc { border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; text-align: left; background: #fff; cursor: pointer; display: grid; gap: 4px; transition: border-color .15s, transform .15s; }
  .svc:hover { transform: translateY(-2px); }
  .svc.on { border-color: var(--accent); background: var(--soft); }
  .svc b { font-size: 16px; } .svc small { color: var(--muted); }
  .svc em { font-style: normal; font-weight: 800; color: var(--accent); }
  .staff { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .staff button { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 14px 6px 6px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .staff button.on { border-color: var(--accent); background: var(--soft); }
  .staff span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; }
  .cal-wrap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 26px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cal-head button { border: 0; background: var(--soft); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .cal small { color: var(--muted); font-weight: 700; font-size: 12px; padding: 4px 0; }
  .cal button { aspect-ratio: 1; border: 0; border-radius: 12px; background: none; cursor: pointer; font-weight: 600; }
  .cal button:hover:not(:disabled) { background: var(--soft); }
  .cal button:disabled { color: #d6cbc8; cursor: default; }
  .cal button.on { background: var(--accent); color: #fff; }
  .cal button.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start; }
  .slots button { border: 1.5px solid var(--line); background: #fff; padding: 10px 0; border-radius: 10px; cursor: pointer; font-weight: 600; }
  .slots button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .slots button:disabled { text-decoration: line-through; color: #ccc; cursor: default; }
  form.details { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  form.details label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  form.details label.full { grid-column: 1 / -1; }
  form.details input, form.details textarea { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; }
  form.details input:focus, form.details textarea:focus { outline: none; border-color: var(--accent); }
  .nav { display: flex; justify-content: space-between; margin-top: auto; padding-top: 24px; }
  .nav button { border: 0; border-radius: 12px; padding: 13px 26px; font-weight: 700; cursor: pointer; }
  .back { background: none; color: var(--muted); }
  .next { background: var(--accent); color: #fff; }
  .next:disabled { opacity: .4; cursor: default; }
  .done { text-align: center; margin: auto; max-width: 420px; }
  .done .tick { width: 84px; height: 84px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; font-size: 40px; margin: 0 auto 16px; animation: pop .4s; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .ics { display: inline-block; margin-top: 16px; background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 12px; text-decoration: none; font-weight: 700; }
  @media (max-width: 860px) { .box { grid-template-columns: 1fr; } .summary { display: none; } .cal-wrap, .services, form.details { grid-template-columns: 1fr; } .right { padding: 24px 18px; } .steps { grid-template-columns: repeat(4, 1fr); } .steps div span { display: none; } }
</style>
</head>
<body>
<div class="box">
  <aside class="left">
    <b class="logo">lumen<span>.</span>studio</b>
    <div style="color:#d9cbc7;font-size:14px">Hair · Nails · Skin<br>Book in under a minute.</div>
    <div class="steps" id="steps"></div>
    <div class="summary" id="summary"></div>
  </aside>
  <section class="right" id="right"></section>
</div>
<script>
  const SERVICES = [['Haircut & style', 45, 55], ['Color & gloss', 90, 120], ['Gel manicure', 40, 38], ['Signature facial', 60, 85]];
  const STAFF = [['Any', '#8a7b76'], ['Maya', '#d9677a'], ['Jonas', '#5b7fa3'], ['Inés', '#7a9a5b']];
  const STEPS = ['Service', 'Date & time', 'Your details', 'Confirmed'];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const s = { step: 0, svc: null, staff: 0, month: new Date(today.getFullYear(), today.getMonth(), 1), date: null, time: null, name: '', email: '', phone: '', note: '' };
  const $ = (id) => document.getElementById(id);
  const fmtDate = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  // Deterministic "already booked" slots so the calendar looks realistic
  const taken = (d, t) => (d.getDate() * 7 + t.length * 3 + parseInt(t)) % 5 === 0;

  function chrome() {
    $('steps').innerHTML = STEPS.map((n, i) => `<div class="${i === s.step ? 'on' : i < s.step ? 'ok' : ''}"><i>${i < s.step ? '✓' : i + 1}</i><span>${n}</span></div>`).join('');
    const svc = SERVICES[s.svc];
    $('summary').innerHTML = `<div><span>Service</span><b>${svc ? svc[0] : '—'}</b></div><div><span>With</span><b>${STAFF[s.staff][0] === 'Any' ? 'First available' : STAFF[s.staff][0]}</b></div><div><span>When</span><b>${s.date ? fmtDate(s.date) + (s.time ? ' · ' + s.time : '') : '—'}</b></div><div><span>Duration</span><b>${svc ? svc[1] + ' min' : '—'}</b></div><div style="border-top:1px solid #5a4442;padding-top:8px"><span>Total</span><b style="font-size:18px">${svc ? '$' + svc[2] : '—'}</b></div>`;
  }
  const nav = (ok) => `<div class="nav"><button class="back" data-go="-1" ${s.step ? '' : 'style="visibility:hidden"'}>← Back</button><button class="next" data-go="1" ${ok ? '' : 'disabled'}>${s.step === 2 ? 'Confirm booking' : 'Continue'}</button></div>`;

  function render() {
    chrome();
    const R = $('right');
    if (s.step === 0) {
      R.innerHTML = `<h2>Choose a service</h2><p class="sub">Prices include products and aftercare tips.</p><div class="services">${SERVICES.map(([n, m, p], i) => `<button class="svc ${s.svc === i ? 'on' : ''}" data-svc="${i}"><b>${n}</b><small>${m} min</small><em>$${p}</em></button>`).join('')}</div>
        <p style="margin:24px 0 0;font-weight:700">Preferred stylist</p><div class="staff">${STAFF.map(([n, c], i) => `<button class="${s.staff === i ? 'on' : ''}" data-staff="${i}"><span style="background:${c}">${n[0]}</span>${n}</button>`).join('')}</div>${nav(s.svc !== null)}`;
    } else if (s.step === 1) {
      const m = s.month, first = (m.getDay() + 6) % 7, days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
      let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((d) => `<small>${d}</small>`).join('') + '<span></span>'.repeat(first);
      for (let d = 1; d <= days; d++) {
        const dt = new Date(m.getFullYear(), m.getMonth(), d);
        const off = dt < today || dt.getDay() === 0 || dt > new Date(today.getTime() + 60 * 864e5);
        cells += `<button data-day="${d}" ${off ? 'disabled' : ''} class="${s.date && +s.date === +dt ? 'on' : ''} ${+dt === +today ? 'today' : ''}">${d}</button>`;
      }
      let slots = '<p class="sub">Pick a date to see open times.</p>';
      if (s.date) {
        const end = s.date.getDay() === 6 ? 15 : 19;
        const list = []; for (let h = 9; h <= end; h += .5) list.push(`${Math.floor(h)}:${h % 1 ? '30' : '00'}`);
        slots = `<p style="margin:0 0 10px;font-weight:700">${fmtDate(s.date)}</p><div class="slots">${list.map((t) => `<button data-time="${t}" ${taken(s.date, t) ? 'disabled' : ''} class="${s.time === t ? 'on' : ''}">${t}</button>`).join('')}</div>`;
      }
      R.innerHTML = `<h2>Pick a date & time</h2><p class="sub">Open Mon–Sat. Times shown in your local time zone.</p><div class="cal-wrap"><div><div class="cal-head"><button data-month="-1" aria-label="Previous month">‹</button><b>${m.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</b><button data-month="1" aria-label="Next month">›</button></div><div class="cal">${cells}</div></div><div>${slots}</div></div>${nav(s.date && s.time)}`;
    } else if (s.step === 2) {
      R.innerHTML = `<h2>Your details</h2><p class="sub">We'll send a reminder 24 hours before your visit.</p><form class="details" id="f"><label>Full name<input name="name" autocomplete="name" required></label><label>Phone<input name="phone" type="tel" autocomplete="tel"></label><label class="full">Email<input name="email" type="email" autocomplete="email" required></label><label class="full">Anything we should know?<textarea name="note" rows="3"></textarea></label></form>${nav(false)}`;
      const f = $('f');
      for (const k of ['name', 'phone', 'email', 'note']) f[k].value = s[k];
      const check = () => { for (const k of ['name', 'phone', 'email', 'note']) s[k] = f[k].value; R.querySelector('.next').disabled = !(s.name.trim().length > 1 && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.email)); };
      f.addEventListener('input', check); check();
    } else {
      const [h, mi] = s.time.split(':').map(Number), start = new Date(s.date); start.setHours(h, mi);
      const end = new Date(start.getTime() + SERVICES[s.svc][1] * 6e4), z = (d) => d.toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
      const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${z(start)}\nDTEND:${z(end)}\nSUMMARY:${SERVICES[s.svc][0]} at Lumen Studio\nEND:VEVENT\nEND:VCALENDAR`;
      R.innerHTML = `<div class="done"><div class="tick">✓</div><h2></h2><p class="sub"></p><a class="ics" download="lumen-booking.ics" href="data:text/calendar;charset=utf-8,${encodeURIComponent(ics)}">Add to calendar</a></div>`;
      R.querySelector('h2').textContent = `You're booked, ${s.name.trim().split(' ')[0]}!`;
      R.querySelector('.sub').textContent = `${SERVICES[s.svc][0]} on ${fmtDate(s.date)} at ${s.time}. A confirmation was sent to ${s.email} (demo — no email is actually sent).`;
    }
  }
  $('right').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.svc) s.svc = +d.svc;
    else if (d.staff) s.staff = +d.staff;
    else if (d.month) { s.month = new Date(s.month.getFullYear(), s.month.getMonth() + +d.month, 1); }
    else if (d.day) { s.date = new Date(s.month.getFullYear(), s.month.getMonth(), +d.day); s.time = null; }
    else if (d.time) s.time = d.time;
    else if (d.go) s.step = Math.max(0, Math.min(3, s.step + +d.go));
    else return;
    render();
  });
  // Preselect a sensible default so first-time visitors see a filled flow
  s.svc = 0; render();
</script>
</body>
</html>
